map $uri $cache_control {
    ~^/assets/                                      "public, max-age=31536000, immutable";
    ~^/cv/                                          "no-store";
    ~^/(?:robots\.txt|sitemap\.xml|llms\.txt)$     "public, max-age=3600, must-revalidate";
    default                                         "no-cache";
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https://avatars.githubusercontent.com; object-src 'none'; script-src 'self'; style-src 'self'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ^~ /cv/ {
        try_files $uri =404;
    }

    location = /favicon.svg {
        try_files $uri =404;
    }

    location = /og.png {
        try_files $uri =404;
    }

    location = /robots.txt {
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
    }

    location = /llms.txt {
        try_files /llms.txt =404;
    }

    location = /theme.js {
        try_files /theme.js =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        return 301 /;
    }

    location = /pt {
        return 301 /pt/;
    }

    location = /pt/ {
        try_files /pt/index.html =404;
    }

    location = /pt/index.html {
        return 301 /pt/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
